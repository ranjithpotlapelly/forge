<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar-qa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <style>
      .qa-title{font-size:24px;font-weight:800;fill:#14532d}
      .qa-sub{font-size:13px;font-weight:600;fill:#166534}
      .qa-box{fill:#f7fdf9;stroke:#86c9a4;stroke-width:1.5;rx:12}
      .qa-hdr{font-size:15px;font-weight:700;fill:#14532d}
      .qa-txt{font-size:12.5px;fill:#374151}
      .qa-num{fill:#166534}
      .qa-numtxt{fill:#fff;font-size:13px;font-weight:700}
      .qa-edge{stroke:#4b5563;stroke-width:1.6;fill:none}
      .qa-lbl{font-size:11px;fill:#6b7280;font-weight:600}
      .qa-note{fill:#fef9c3;stroke:#d1a207;stroke-width:1.5;rx:8}
      .qa-notetxt{font-size:11.5px;fill:#92400e;font-weight:600}
    </style>
  </defs>

  <rect width="560" height="660" fill="#ffffff"/>
  <text x="280" y="34" text-anchor="middle" class="qa-title">Ask a Question</text>
  <text x="280" y="54" text-anchor="middle" class="qa-sub">Flow diagram — Forge Q&amp;A path, self-correcting retrieval</text>

  <!-- 1 -->
  <rect x="40" y="80" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="103" r="13" class="qa-num"/><text x="66" y="108" text-anchor="middle" class="qa-numtxt">1</text>
  <text x="90" y="108" class="qa-hdr">You ask a question</text>
  <text x="56" y="128" class="qa-txt">"How does login work?"</text>
  <path class="qa-edge" d="M280 138 L280 156" marker-end="url(#ar-qa)"/>

  <!-- 2 -->
  <rect x="40" y="156" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="179" r="13" class="qa-num"/><text x="66" y="184" text-anchor="middle" class="qa-numtxt">2</text>
  <text x="90" y="184" class="qa-hdr">Classify intent</text>
  <text x="56" y="204" class="qa-txt">Routed to the Q&amp;A flow</text>
  <path class="qa-edge" d="M280 214 L280 232" marker-end="url(#ar-qa)"/>

  <!-- 3 -->
  <rect x="40" y="232" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="255" r="13" class="qa-num"/><text x="66" y="260" text-anchor="middle" class="qa-numtxt">3</text>
  <text x="90" y="260" class="qa-hdr">Retrieve</text>
  <text x="56" y="280" class="qa-txt">Hybrid search returns the best-matching code</text>
  <path class="qa-edge" d="M280 290 L280 316" marker-end="url(#ar-qa)"/>

  <!-- decision -->
  <polygon points="280,316 360,360 280,404 200,360" fill="#fef9c3" stroke="#d1a207" stroke-width="1.5"/>
  <text x="280" y="356" text-anchor="middle" class="qa-txt">Sufficient to</text>
  <text x="280" y="372" text-anchor="middle" class="qa-txt">answer?</text>
  <path class="qa-edge" d="M360 360 L400 360" marker-end="url(#ar-qa)"/>
  <text x="368" y="352" class="qa-lbl">no</text>
  <path class="qa-edge" d="M280 404 L280 428" marker-end="url(#ar-qa)"/>
  <text x="288" y="418" class="qa-lbl">yes</text>

  <!-- retry note -->
  <rect x="398" y="326" width="122" height="68" class="qa-note"/>
  <text x="410" y="345" class="qa-notetxt">↻ refine query</text>
  <text x="410" y="360" class="qa-notetxt">search once more</text>
  <text x="410" y="375" class="qa-notetxt">— never twice</text>
  <path class="qa-edge" d="M459 394 C459 420, 340 428, 288 434" marker-end="url(#ar-qa)"/>

  <!-- 5 -->
  <rect x="40" y="428" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="451" r="13" class="qa-num"/><text x="66" y="456" text-anchor="middle" class="qa-numtxt">5</text>
  <text x="90" y="456" class="qa-hdr">Answer</text>
  <text x="56" y="476" class="qa-txt">Drafted from the retrieved code, citing file:line</text>
  <path class="qa-edge" d="M280 486 L280 504" marker-end="url(#ar-qa)"/>

  <!-- 6 -->
  <rect x="40" y="504" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="527" r="13" class="qa-num"/><text x="66" y="532" text-anchor="middle" class="qa-numtxt">6</text>
  <text x="90" y="532" class="qa-hdr">You get an answer</text>
  <text x="56" y="552" class="qa-txt">Every claim linked to its source</text>

  <rect x="40" y="590" width="480" height="50" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5" rx="10"/>
  <text x="56" y="612" font-size="11.5" fill="#3730a3">Cap: the retry can fire at most once per question — corrective_retrieve always</text>
  <text x="56" y="628" font-size="11.5" fill="#3730a3">routes onward, never back to grading. Off by default (answer.corrective_retrieval).</text>
</svg>
