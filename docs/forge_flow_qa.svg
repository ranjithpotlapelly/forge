<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 830" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar-qa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="ar-qa-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#9333ea" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <style>
      .qa-title{font-size:24px;font-weight:800;fill:#14532d}
      .qa-sub{font-size:13px;font-weight:600;fill:#166534}
      .qa-box{fill:#f7fdf9;stroke:#86c9a4;stroke-width:1.5;rx:12}
      .qa-hdr{font-size:15px;font-weight:700;fill:#14532d}
      .qa-txt{font-size:12.5px;fill:#374151}
      .qa-num{fill:#166534}
      .qa-numtxt{fill:#fff;font-size:13px;font-weight:700}
      .qa-edge{stroke:#4b5563;stroke-width:1.6;fill:none}
      .qa-lbl{font-size:11px;fill:#6b7280;font-weight:600}
      .qa-note{fill:#fef9c3;stroke:#d1a207;stroke-width:1.5;rx:8}
      .qa-notetxt{font-size:11.5px;fill:#92400e;font-weight:600}
      .qa-graph{fill:#faf5ff;stroke:#9333ea;stroke-width:1.5;stroke-dasharray:5 3;rx:8}
      .qa-graphtxt{font-size:11px;fill:#6b21a8;font-weight:600}
      .qa-optlbl{font-size:10.5px;fill:#7e22ce;font-weight:600;font-style:italic}
    </style>
  </defs>

  <rect width="620" height="830" fill="#ffffff"/>
  <text x="280" y="34" text-anchor="middle" class="qa-title">Ask a Question</text>
  <text x="280" y="54" text-anchor="middle" class="qa-sub">Flow diagram — Forge Q&amp;A path, self-correcting retrieval + optional graph augmentation</text>

  <!-- 1 -->
  <rect x="40" y="80" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="103" r="13" class="qa-num"/><text x="66" y="108" text-anchor="middle" class="qa-numtxt">1</text>
  <text x="90" y="108" class="qa-hdr">You ask a question</text>
  <text x="56" y="128" class="qa-txt">"How does login work?"</text>
  <path class="qa-edge" d="M280 138 L280 156" marker-end="url(#ar-qa)"/>

  <!-- 2 -->
  <rect x="40" y="156" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="179" r="13" class="qa-num"/><text x="66" y="184" text-anchor="middle" class="qa-numtxt">2</text>
  <text x="90" y="184" class="qa-hdr">Classify intent</text>
  <text x="56" y="204" class="qa-txt">Routed to the Q&amp;A flow</text>
  <path class="qa-edge" d="M280 214 L280 234" marker-end="url(#ar-qa)"/>

  <!-- graph-question decision (optional, off by default) -->
  <polygon points="280,234 360,278 280,322 200,278" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="280" y="274" text-anchor="middle" class="qa-txt">Graph question &amp;</text>
  <text x="280" y="290" text-anchor="middle" class="qa-txt">graph_expand on?</text>
  <path class="qa-edge" d="M280 322 L280 342" marker-end="url(#ar-qa)"/>
  <text x="290" y="336" class="qa-lbl">no</text>
  <path d="M360 278 L396 278" fill="none" stroke="#9333ea" stroke-width="1.6" marker-end="url(#ar-qa-p)"/>
  <text x="365" y="270" class="qa-optlbl">yes</text>

  <!-- graph answer (optional, deterministic, no LLM call) -->
  <rect x="398" y="245" width="122" height="68" class="qa-graph"/>
  <text x="410" y="264" class="qa-graphtxt">→ Graph answer</text>
  <text x="410" y="279" class="qa-graphtxt">deterministic,</text>
  <text x="410" y="294" class="qa-graphtxt">no LLM call</text>
  <path d="M520 279 C 580 320, 580 600, 500 668" fill="none" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar-qa-p)"/>
  <text x="536" y="465" class="qa-optlbl">skips</text>
  <text x="536" y="479" class="qa-optlbl">retrieve+LLM</text>

  <!-- 3 -->
  <rect x="40" y="342" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="365" r="13" class="qa-num"/><text x="66" y="370" text-anchor="middle" class="qa-numtxt">3</text>
  <text x="90" y="370" class="qa-hdr">Retrieve</text>
  <text x="56" y="390" class="qa-txt">Hybrid search returns the best-matching code</text>
  <path class="qa-edge" d="M280 400 L280 426" marker-end="url(#ar-qa)"/>

  <!-- decision -->
  <polygon points="280,426 360,470 280,514 200,470" fill="#fef9c3" stroke="#d1a207" stroke-width="1.5"/>
  <text x="280" y="466" text-anchor="middle" class="qa-txt">Sufficient to</text>
  <text x="280" y="482" text-anchor="middle" class="qa-txt">answer?</text>
  <path class="qa-edge" d="M360 470 L400 470" marker-end="url(#ar-qa)"/>
  <text x="368" y="462" class="qa-lbl">no</text>
  <path class="qa-edge" d="M280 514 L280 592" marker-end="url(#ar-qa)"/>
  <text x="288" y="528" class="qa-lbl">yes</text>
  <text x="292" y="556" class="qa-optlbl">optional: +1-hop graph context</text>

  <!-- retry note -->
  <rect x="398" y="436" width="122" height="68" class="qa-note"/>
  <text x="410" y="455" class="qa-notetxt">↻ refine query</text>
  <text x="410" y="470" class="qa-notetxt">search once more</text>
  <text x="410" y="485" class="qa-notetxt">— never twice</text>
  <path class="qa-edge" d="M459 504 C459 540, 330 565, 288 590" marker-end="url(#ar-qa)"/>

  <!-- 5 -->
  <rect x="40" y="594" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="617" r="13" class="qa-num"/><text x="66" y="622" text-anchor="middle" class="qa-numtxt">5</text>
  <text x="90" y="622" class="qa-hdr">Answer</text>
  <text x="56" y="642" class="qa-txt">Drafted from the retrieved code, citing file:line</text>
  <path class="qa-edge" d="M280 652 L280 670" marker-end="url(#ar-qa)"/>

  <!-- 6 -->
  <rect x="40" y="670" width="480" height="58" class="qa-box"/>
  <circle cx="66" cy="693" r="13" class="qa-num"/><text x="66" y="698" text-anchor="middle" class="qa-numtxt">6</text>
  <text x="90" y="698" class="qa-hdr">You get an answer</text>
  <text x="56" y="718" class="qa-txt">Every claim linked to its source</text>

  <rect x="40" y="756" width="480" height="50" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5" rx="10"/>
  <text x="56" y="778" font-size="11.5" fill="#3730a3">Cap: the retry can fire at most once per question — corrective_retrieve always</text>
  <text x="56" y="794" font-size="11.5" fill="#3730a3">routes onward, never back to grading. Off by default (answer.corrective_retrieval).</text>
</svg>
