<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 830" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="sq-qa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/></marker>
    <marker id="sq-qa-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-linecap="round"/></marker>
    <style>
      .sq-qa-title{font-size:24px;font-weight:800;fill:#14532d}
      .sq-qa-sub{font-size:14px;fill:#166534;font-weight:600}
      .sq-qa-actor{fill:#e7f5ec;stroke:#86c9a4;stroke-width:1.5;rx:8}
      .sq-qa-atxt{font-size:13px;font-weight:700;fill:#14532d}
      .sq-qa-life{stroke:#c9d3cd;stroke-width:1.4;stroke-dasharray:4 4}
      .sq-qa-act{fill:#d7ede0;stroke:#86c9a4;stroke-width:1}
      .sq-qa-msg{stroke:#374151;stroke-width:1.5;fill:none}
      .sq-qa-ret{stroke:#9333ea;stroke-width:1.4;fill:none;stroke-dasharray:5 3}
      .sq-qa-mtxt{font-size:11.5px;fill:#1f2937}
      .sq-qa-rtxt{font-size:11px;fill:#7e22ce;font-style:italic}
      .sq-qa-note{fill:#fef9c3;stroke:#d1a207;stroke-width:1;rx:5}
      .sq-qa-ntxt{font-size:10.5px;fill:#713f12}
      .sq-qa-local{font-size:10px;font-weight:700;fill:#166534}
      .sq-qa-opt{fill:#faf5ff;stroke:#9333ea;stroke-width:1.3;stroke-dasharray:5 3;rx:6}
      .sq-qa-opttxt{font-size:10.5px;fill:#6b21a8}
      .sq-qa-optlbl{font-size:9.5px;font-weight:700;fill:#9333ea}
    </style>
  </defs>
  <rect width="1020" height="830" fill="#fff"/>
  <text x="30" y="38" class="sq-qa-title">Forge — Sequence: Ask a Code Question</text>
  <text x="30" y="60" class="sq-qa-sub">everything local &amp; free · streamed answer with citations · optional graph augmentation (Prompt 27)</text>

  <!-- actors -->
  <g>
    <rect x="40"  y="82" width="120" height="34" class="sq-qa-actor"/><text x="100" y="104" text-anchor="middle" class="sq-qa-atxt">User (UI)</text>
    <rect x="210" y="82" width="130" height="34" class="sq-qa-actor"/><text x="275" y="104" text-anchor="middle" class="sq-qa-atxt">LangGraph</text>
    <rect x="395" y="82" width="130" height="34" class="sq-qa-actor"/><text x="460" y="104" text-anchor="middle" class="sq-qa-atxt">Retriever</text>
    <rect x="580" y="82" width="120" height="34" class="sq-qa-actor"/><text x="640" y="104" text-anchor="middle" class="sq-qa-atxt">Chroma</text>
    <rect x="740" y="82" width="120" height="34" class="sq-qa-actor"/><text x="800" y="104" text-anchor="middle" class="sq-qa-atxt">Ollama (LLM)</text>
    <rect x="895" y="82" width="95"  height="34" class="sq-qa-actor"/><text x="942" y="104" text-anchor="middle" class="sq-qa-atxt">Phoenix</text>
  </g>
  <!-- lifelines -->
  <line x1="100" y1="116" x2="100" y2="800" class="sq-qa-life"/>
  <line x1="275" y1="116" x2="275" y2="800" class="sq-qa-life"/>
  <line x1="460" y1="116" x2="460" y2="800" class="sq-qa-life"/>
  <line x1="640" y1="116" x2="640" y2="800" class="sq-qa-life"/>
  <line x1="800" y1="116" x2="800" y2="800" class="sq-qa-life"/>
  <line x1="942" y1="116" x2="942" y2="800" class="sq-qa-life"/>

  <!-- messages -->
  <text x="105" y="150" class="sq-qa-mtxt">1. "how does customauth authenticate a user?"</text>
  <line x1="100" y1="158" x2="275" y2="158" class="sq-qa-msg" marker-end="url(#sq-qa-a)"/>

  <rect x="269" y="158" width="12" height="570" class="sq-qa-act"/>
  <text x="200" y="182" class="sq-qa-mtxt">2. route → needs retrieval</text>
  <path class="sq-qa-msg" d="M275 176 q40 14 0 26" marker-end="url(#sq-qa-a)"/>

  <!-- optional graph fast-path, off by default -->
  <rect x="140" y="206" width="700" height="40" class="sq-qa-opt"/>
  <text x="152" y="220" class="sq-qa-optlbl">opt [graph_expand=true &amp; question matches "what calls X"]</text>
  <text x="152" y="236" class="sq-qa-opttxt">→ LangGraph answers straight from a SQLite call-graph store here instead — no Retriever/Chroma/Ollama call, deterministic, real citations. Fuzzy questions never take this branch.</text>

  <text x="300" y="266" class="sq-qa-mtxt">3. search(query, k)</text>
  <line x1="281" y1="274" x2="460" y2="274" class="sq-qa-msg" marker-end="url(#sq-qa-a)"/>
  <rect x="454" y="274" width="12" height="120" class="sq-qa-act"/>

  <text x="480" y="300" class="sq-qa-mtxt">4. hybrid: lexical + embed(query)</text>
  <line x1="466" y1="308" x2="640" y2="308" class="sq-qa-msg" marker-end="url(#sq-qa-a)"/>
  <rect x="634" y="308" width="12" height="40" class="sq-qa-act"/>
  <text x="490" y="338" class="sq-qa-rtxt">5. top-k chunks + file:line meta</text>
  <line x1="640" y1="344" x2="466" y2="344" class="sq-qa-ret" marker-end="url(#sq-qa-ad)"/>

  <rect x="352" y="362" width="230" height="26" class="sq-qa-note"/>
  <text x="360" y="379" class="sq-qa-ntxt">6. read real code from disk (pointers → source), budget to context</text>

  <text x="480" y="414" class="sq-qa-rtxt">7. ranked chunks</text>
  <line x1="460" y1="420" x2="281" y2="420" class="sq-qa-ret" marker-end="url(#sq-qa-ad)"/>

  <!-- optional graph-expand augmentation, off by default -->
  <rect x="140" y="428" width="700" height="40" class="sq-qa-opt"/>
  <text x="152" y="442" class="sq-qa-optlbl">opt [graph_expand=true]</text>
  <text x="152" y="458" class="sq-qa-opttxt">→ LangGraph asks the same SQLite call-graph store for 1-hop callers/callees of the top chunks' symbols and merges them into context here, before generating.</text>

  <text x="300" y="492" class="sq-qa-mtxt">8. generate(question + code)  · stream</text>
  <line x1="281" y1="500" x2="800" y2="500" class="sq-qa-msg" marker-end="url(#sq-qa-a)"/>
  <rect x="794" y="500" width="12" height="150" class="sq-qa-act"/>
  <text x="812" y="520" class="sq-qa-local">local · $0</text>

  <text x="470" y="540" class="sq-qa-rtxt">9. tokens stream back …</text>
  <line x1="800" y1="546" x2="281" y2="546" class="sq-qa-ret" marker-end="url(#sq-qa-ad)"/>
  <line x1="800" y1="570" x2="281" y2="570" class="sq-qa-ret" marker-end="url(#sq-qa-ad)"/>
  <line x1="800" y1="594" x2="281" y2="594" class="sq-qa-ret" marker-end="url(#sq-qa-ad)"/>

  <text x="105" y="624" class="sq-qa-mtxt">10. stream answer + clickable citations</text>
  <line x1="275" y1="632" x2="100" y2="632" class="sq-qa-ret" marker-end="url(#sq-qa-ad)"/>

  <rect x="352" y="648" width="250" height="26" class="sq-qa-note"/>
  <text x="360" y="665" class="sq-qa-ntxt">11. checkpoint turn to SQLite (resume-safe)</text>

  <text x="300" y="700" class="sq-qa-mtxt">12. spans: route, retrieve, tokens, latency</text>
  <line x1="281" y1="708" x2="942" y2="708" class="sq-qa-msg" marker-end="url(#sq-qa-a)"/>

  <text x="30" y="768" class="sq-qa-rtxt">Solid = call · dashed purple = return/stream · yellow = internal step · dashed purple box = optional, off by default. No network calls leave the machine (graph store included).</text>
</svg>
