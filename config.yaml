# Forge — composition root.
# Each port names the adapter that fills it. Swapping a tool (e.g. chroma -> qdrant,
# ollama -> a hosted API) is a one-line change here plus one adapter file. No logic moves.

app:
  name: Forge
  env: dev

# --- Reasoning (Phase 2) ---
llm:
  adapter: ollama              # -> adapters/llm_ollama.py
  model: qwen3:8b               # primary reasoning model; run `ollama pull qwen3:8b` first
  host: ${OLLAMA_HOST}         # from .env; falls back to http://localhost:11434
  temperature: 0.2
  num_ctx: 16384                # plan/edit/test loop needs target file + plan + test output in one prompt
  # Phase 23 (perf tuning): per-path num_ctx, right-sized instead of one value
  # maxed for everything. The answer path (app/chainlit_app.py) uses
  # answer_num_ctx; edit_num_ctx is reserved for product/code_edit.py's calls
  # -- not wired in yet, kept here so it's configured when it is.
  answer_num_ctx: 8192          # Q&A rarely needs the full 16384
  edit_num_ctx: 16384           # (future) code-edit loop needs the headroom
  keep_alive: 30m                # sent on every Ollama request; without it, Ollama
                                  # unloads an idle model (~5min default) and the next
                                  # call pays a full reload. Alternative: set the
                                  # OLLAMA_KEEP_ALIVE env var server-side (see README).
  show_timing: true              # print a [timing] line after each Q&A answer

# A separate, faster model for the Q&A answer path specifically -- qwen3:8b is
# a thinking model (see adapters/llm_ollama.py's <think> stripping) and its
# internal reasoning alone can be a large chunk of a "why is this so slow"
# answer's latency, independent of num_ctx. llm.model stays qwen3:8b for
# planning/task work; only app/chainlit_app.py's answer path uses this.
answer_model:
  adapter: ollama
  model: qwen3:4b

# The code-EDIT step (Phase 7) gets its own slot so patch quality can be upgraded
# independently. llm/answer_model/embeddings stay on Ollama -- only this block
# goes remote. -> adapters/llm_openai_compatible.py. See README's "Upgrade path".
# base_url/api_key/model all come from .env via config_loader's ${VAR}
# substitution (app/config_loader.py is the only place that knows env var
# names) -- the adapter itself never reads os.environ.
code_model:
  adapter: openai_compatible
  # OpenRouter fallback chain (server-side, no client retry logic needed):
  # tries CODE_MODEL_NAME first, then FALLBACK_1, then FALLBACK_2, moving on
  # rate-limit/moderation/downtime/any error. See adapters/llm_openai_compatible.py.
  models:
    - ${CODE_MODEL_NAME}
    - ${CODE_MODEL_FALLBACK_1}
    - ${CODE_MODEL_FALLBACK_2}
  base_url: ${CODE_MODEL_BASE_URL}
  api_key: ${CODE_MODEL_API_KEY}    # from .env; never hardcode, never logged
  # Billing guard (adapters/llm_openai_compatible.py): refuses to start if
  # any configured model above lacks OpenRouter's ":free" suffix, unless
  # this is explicitly flipped to true. Real safety net is a hard credit
  # limit on the OpenRouter key itself (openrouter.ai/keys) -- this is a
  # trip-wire against an accidental config change, not a replacement for that.
  allow_paid_models: false

# --- Knowledge (Phase 3) ---
embeddings:
  adapter: ollama
  model: nomic-embed-text      # light + fast on CPU

retriever:
  adapter: chroma              # -> adapters/retriever_chroma.py (semantic half, embedded, no server)
                                # Alternative: qdrant -> adapters/retriever_qdrant.py (same Retriever port,
                                # same skeleton-index contract -- proof the port supports swapping vector
                                # stores without touching core/, product/, or app/ask.py). Local Qdrant
                                # only: set qdrant_url (running server) or leave it blank to use
                                # qdrant_path (embedded/on-disk, no server needed) -- url wins if both are set.
  path: ./.data/chroma
  collection: forge_code
  qdrant_url: ${QDRANT_URL}       # e.g. http://localhost:6333 for `docker run qdrant/qdrant`; from .env
  qdrant_path: ./.data/qdrant     # embedded/on-disk mode, used when qdrant_url is blank
  qdrant_collection: forge_code_qdrant  # separate name from `collection` (Chroma's) so the two indexes never collide
  top_k: 8  # tried raising this to 15 after a real miss (shell.component.ts
            # ranked 13th for "dark mode toggle button" -- semantic-only
            # search is weak on whole-file JS/TS chunks) -- but task_retrieve
            # shares this k, and 15 fed enough extra file content into the
            # planning prompt to hit a real Vulkan/iGPU allocation failure
            # ("ggml_gallocr_reserve_n_impl: failed to allocate Vulkan0
            # buffer") on this machine's shared-memory hardware. Reverted:
            # the actual fix was retriever_fts.py indexing `content` (below),
            # which alone brings shell.component.ts to rank #2 even at k=8 --
            # raising k further wasn't needed and isn't worth the memory risk.
  # Phase 15: fused in behind the same Retriever port by adapters/retriever_hybrid.py
  # -> adapters/retriever_fts.py (SQLite FTS5 over symbol/signature/path/content, for exact-identifier and keyword matches)
  lexical_path: ./.data/lexical.db
  # Phase 23 (perf tuning): the Q&A answer path retrieves fewer, higher-ranked
  # chunks than top_k (faster prefill), and expands only the best few to full
  # source in the prompt -- the rest get a path-only reference line instead
  # of their full body. See adapters/engine_langgraph.py:build_answer_messages.
  answer_top_k: 5
  answer_max_expanded: 4
  # Prompt 27 (additive, default off): pull 1-hop call-graph neighbours of
  # the top retrieved chunks into Q&A context, and answer "what calls X"
  # questions directly from the graph instead of retrieval+LLM. Needs the
  # graph built first (python -m app.index_graph) -- see code_graph below.
  graph_expand: false

# --- Optional dependency graph (Prompt 27, additive, default off) ---
# Built separately from the main index via `python -m app.index_graph`
# (adapters/code_graph_extract.py + adapters/code_graph_sqlite.py) -- never
# runs as part of the normal /index path. Scoped to Java + TypeScript only.
code_graph:
  path: ./.data/code_graph.db
  languages: [java, typescript]

# --- Orchestration (Phase 4) ---
engine:
  adapter: langgraph           # -> adapters/engine_langgraph.py (graph + node logic both live here)
  checkpoint_path: ./.data/checkpoints.db   # Phase 5: per-thread graph state, separate file from the product store

# --- State (Phase 5) ---
store:
  adapter: sqlite              # -> adapters/store_sqlite.py
  path: ./.data/forge.db

# --- Observability (Phase 6) ---
observability:
  adapter: phoenix             # -> adapters/observability_phoenix.py
  enabled: true
  endpoint: ${PHOENIX_ENDPOINT}        # OTLP/gRPC; from .env — localhost natively, phoenix:4317 in docker-compose
  project_name: forge

# --- Action (Phase 7) ---
tools:
  adapter: mcp                 # -> adapters/tools_mcp.py (official `mcp` SDK, not
                                # langchain-mcp-adapters — nothing else here is LangChain-wrapped)
  server_script: adapters/mcp_servers/workspace_server.py
  workspace: ./.data/workspace

# --- Knowledge (Phase 3) ingest source (Phase 10) ---
ingest:
  adapter: fs                  # -> adapters/ingest_fs.py (ast-based chunking for .py, whole-file fallback otherwise)

# --- GitHub (Phase 13/18): open_pr -> adapters/github_pr.py, fetch_issue -> adapters/github_issue.py ---
github:
  token: ${GITHUB_TOKEN}        # from .env; never hardcode, never logged
  api_base: https://api.github.com
  repo: ranjithpotlapelly/forge  # owner/name fetch_issue reads issues from -- never hardcoded in the adapter

# --- Optional Slack "done" notifications (additive, default off) ---
# -> adapters/tool_slack.py. With no SLACK_WEBHOOK_URL in .env this expands to
# "" and notify_slack silently no-ops -- default behaviour is unchanged.
slack:
  webhook_url: ${SLACK_WEBHOOK_URL}

# --- Optional corrective retrieval (additive, default off) ---
# One extra grade+retry pass on the Q&A answer path
# (adapters/engine_langgraph.py): after the first retrieval, the model grades
# whether the chunks are sufficient; if not, ONE corrective retrieval runs
# with a refined query and the results are merged before answering. With
# this off, LangGraphEngine._build() doesn't even add the grading/correction
# nodes -- the graph is identical to before this existed.
answer:
  corrective_retrieval: false

# --- Forge product settings ---
forge:
  repo_path: "/mnt/host_projects/rag-frontend-angular-v2"  # local checkout the task/edit/test pipeline targets (prepare_workspace/run_tests) -- NOT the same as whatever /index was last pointed at, which only widens Q&A retrieval. This is the real git root (matches ranjithpotlapelly/rag-frontend exactly -- .git lives here, not one level down); the Angular app itself is a subfolder (rag-frontend/) of this repo upstream, which is why it's not repo_path itself. run_tests' marker detection searches one level down for exactly this reason.
  languages: [python, javascript, typescript, go, java]
  # Anything that touches the outside world pauses for human approval:
  require_approval_for: [write_file, commit, push, open_pr]
